name: RegIntel daily crawl

on:
  schedule:
    - cron: "15 23 * * *"   # 06:15 WIB
  workflow_dispatch:
    inputs:
      all:
        description: "Crawl every BPK regulation type (slow)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: regintel
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore parsed-text cache
        uses: actions/cache@v4
        with:
          path: |
            imeos/pipeline/state/text
            imeos/pipeline/cache
          key: regintel-text-${{ github.run_id }}
          restore-keys: regintel-text-
      - name: Install OCR + deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ind
          pip install -r imeos/pipeline/requirements.txt
      - name: Run pipeline
        working-directory: imeos/pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -W ignore run_daily.py ${{ inputs.all && '--all' || '' }}
      - name: Commit data
        run: |
          git config user.name "regintel-bot"
          git config user.email "regintel-bot@users.noreply.github.com"
          git add imeos/data/regintel imeos/pipeline/state
          git diff --cached --quiet || git commit -m "RegIntel data update $(date -u +%F)"
          git push
