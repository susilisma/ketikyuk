<script>
const f = L(I18N.flow); $("#flow").innerHTML = f.slice(0, 5).map((x) => `<span>${x}</span>`).join("<i>→</i>") + "<i>⇒</i>" + f.slice(5).map((x) => `<span>${x}</span>`).join("");
fetch("/imeos/data/regintel/meta.json").then((r) => r.json()).then((m) => { $("#regcount").textContent = T("regs", { n: m.total, d: m.diffs }); }).catch(() => { $("#regcount").textContent = T("open"); });
fetch("/imeos/data/regintel/alerts.json").then((r) => r.json()).then((a) => { $("#alerts").innerHTML = a.slice(0, 5).map((x) => `<div class="alert"><span class="mono mute">${x.date}</span><span><b>${esc(x.id)}</b> ${esc(x.title.replace(/^.*?tentang /i, ""))}</span><span class="chip ${x.status === "revoked" ? "bad" : x.kind === "amendment" ? "warn" : "info"}">${T("k." + x.kind)}</span></div>`).join("") || `<span class="mute">${T("none")}</span>`; }).catch(() => { $("#alerts").textContent = T("nodata"); });
</script>
