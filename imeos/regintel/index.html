<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-t="p.title">RegIntel · Indonesia Regulatory Intelligence</title>
<link rel="stylesheet" href="/imeos/assets/os.css">
<style>
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr}}
.list .it{display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line2);align-items:start;font-size:13.5px}
.list .it:hover{background:#fafaf7}
.list .id{font-family:var(--mono);font-size:12.5px}
.list .m{font-size:12px;color:var(--mute);margin-top:2px}
.rel{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13.5px}
.change{border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow:hidden}
.change .h{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#f7f8f9;font-size:13px;flex-wrap:wrap}
.change .body{padding:10px 12px}
.art{padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;white-space:pre-wrap}
.art b{display:block;color:var(--brand);margin-bottom:2px}
.pane{display:none}.pane.on{display:block}
.sum h4{margin:12px 0 4px}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero"><div class="eyebrow">Indonesia Regulatory Intelligence</div><h1 data-t="p.h1"></h1><p class="lede" id="meta" data-t="loading"></p></div>
  <div class="tabs" id="tabs"><button data-p="alerts" data-t="tab.alerts"></button><button data-p="lib" class="on" data-t="tab.lib"></button><button data-p="doc" data-t="tab.doc"></button><button data-p="src" data-t="tab.src"></button></div>
  <section class="pane" id="p-alerts"><div class="card"><h2 data-t="al.h"></h2><div id="alerts" class="list"></div></div></section>
  <section class="pane on" id="p-lib"><div class="card">
    <div class="filters"><input type="search" id="q" data-t-ph="f.q"><select id="f-form"><option value="" data-t="f.allForms"></option></select><select id="f-ag"><option value="" data-t="f.allAg"></option></select><select id="f-tp"><option value="" data-t="f.allTp"></option></select><select id="f-st"><option value="" data-t="f.allSt"></option><option value="in_force" data-t="st.in_force"></option><option value="amended" data-t="st.amended"></option><option value="partially_revoked" data-t="st.partially_revoked"></option><option value="not_yet_effective" data-t="st.not_yet_effective"></option><option value="revoked" data-t="st.revoked"></option></select><select id="f-y"><option value="" data-t="f.allY"></option></select></div>
    <div class="row" style="font-size:12.5px;color:var(--mute)"><span id="count"></span><span class="spacer"></span><label class="chk" style="margin:0"><input type="checkbox" id="f-rel" checked> <span data-t="f.rel"></span></label><label class="chk" style="margin:0"><input type="checkbox" id="f-tx"> <span data-t="f.tx"></span></label></div>
    <div id="list" class="list"></div><div class="row noprint" style="justify-content:center;margin-top:10px"><button class="btn ghost sm" id="more" data-t="f.more"></button></div></div></section>
  <section class="pane" id="p-doc"><div id="doc" class="card empty" data-t="doc.empty"></div></section>
  <section class="pane" id="p-src"><div class="card" id="src"></div></section>
  <p class="disclaimer" data-t="p.disc"></p>
</main>
<script src="/imeos/assets/i18n.js"></script>

<script src="/imeos/assets/common.js"></script><script src="/imeos/assets/kb.js"></script>
<script>
applyI18N();
const D = "/imeos/data/regintel/";
const STC = { in_force: "ok", amended: "info", partially_revoked: "warn", not_yet_effective: "info", revoked: "bad", unknown: "" };
let META, INDEX = [], byId = {}, shown = 0, filtered = [];
const j = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
function tab(p) { $$("#tabs button").forEach((x) => x.classList.toggle("on", x.dataset.p === p)); $$(".pane").forEach((x) => x.classList.toggle("on", x.id === "p-" + p)); }
$$("#tabs button").forEach((b) => b.onclick = () => { tab(b.dataset.p); history.replaceState(null, "", "?tab=" + b.dataset.p); });
const chip = (st) => `<span class="chip ${STC[st] || ""}">${T("st." + (STC[st] != null ? st : "unknown"))}</span>`;
const topic = (t) => L(META.topics[t]) || t;
const agency = (a) => L(META.agencies[a]) || "";
function row(r) {
  return `<div class="it"><div><a class="id" href="?id=${encodeURIComponent(r.id)}" onclick="openDoc('${r.id}');return false">${esc(r.f)} ${esc(r.n)}/${r.y}</a><div class="m">${esc(agency(r.ag))}</div></div>
    <div><div class="t">${esc(r.t)}</div><div class="m">${r.de ? T("l.enacted") + " " + r.de : ""}${r.dv ? " · " + T("l.effective") + " " + r.dv : ""} · ${r.tp.map(topic).join(", ") || "—"}${r.df ? " · <b>" + T("l.hasDiff") + "</b>" : ""}${r.sm ? " · " + T("l.hasSum") : ""}${r.ab.length ? " · " + T("l.amendedBy", { x: r.ab.join(", ") }) : ""}</div></div>
    <div>${chip(r.st)}<div class="m" style="text-align:right">${T("l.rel", { r: r.rv })}</div></div></div>`;
}
function applyFilter() {
  const q = $("#q").value.trim().toLowerCase(), f = $("#f-form").value, ag = $("#f-ag").value, tp = $("#f-tp").value, st = $("#f-st").value, y = $("#f-y").value;
  filtered = INDEX.filter((r) => (!f || r.f === f) && (!ag || r.ag === ag) && (!tp || r.tp.includes(tp)) && (!st || r.st === st) && (!y || String(r.y) === y) && (!$("#f-rel").checked || r.rv >= 50) && (!$("#f-tx").checked || r.tx) && (!q || (r.id + " " + r.t + " " + r.n).toLowerCase().includes(q)));
  shown = 0; $("#list").innerHTML = ""; more();
}
function more() { const next = filtered.slice(shown, shown + 60); $("#list").insertAdjacentHTML("beforeend", next.map(row).join("")); shown += next.length; $("#count").textContent = T("f.count", { n: filtered.length, s: shown }); $("#more").style.display = shown < filtered.length ? "" : "none"; }
$("#more").onclick = more;
["q", "f-form", "f-ag", "f-tp", "f-st", "f-y", "f-rel", "f-tx"].forEach((id) => $("#" + id).oninput = applyFilter);
const diffHtml = (d) => d.map(([op, t]) => op === "=" ? esc(t) : op === "-" ? `<del>${esc(t)}</del>` : `<ins>${esc(t)}</ins>`).join(" ");
const relLabel = (t) => t === "Mengubah" ? T("doc.amendedIn") : t === "Mencabut" ? T("doc.revokedIn") : t;

async function openDoc(id) {
  tab("doc"); history.replaceState(null, "", "?id=" + encodeURIComponent(id));
  const r = byId[id]; if (!r) { $("#doc").innerHTML = `<div class="empty">${T("doc.missing", { id: esc(id) })}</div>`; return; }
  $("#doc").innerHTML = `<div class="empty">${T("doc.loading", { id: esc(id) })}</div>`;
  const [doc, diff, sum] = await Promise.all([r.tx ? j(D + "docs/" + id + ".json").catch(() => null) : null, r.df ? j(D + "diffs/" + id + ".json").catch(() => null) : null, r.sm ? j(D + "summaries/" + id + ".json").catch(() => null) : null]);
  const kb = KB.regs[id];
  const rels = r.rel.map(([t, tgt, lbl]) => `<span class="mute">${esc(t)}</span><span>${byId[tgt] ? `<a href="?id=${tgt}" onclick="openDoc('${tgt}');return false">${esc(lbl)}</a>` : esc(lbl)} ${byId[tgt] ? chip(byId[tgt].st) : ""}</span>`).join("");
  const inbound = INDEX.filter((x) => x.rel.some((z) => z[1] === id)).map((x) => `<span class="mute">${esc(relLabel(x.rel.find((z) => z[1] === id)[0]))}</span><span><a href="?id=${x.id}" onclick="openDoc('${x.id}');return false">${esc(x.f)} ${esc(x.n)}/${x.y}</a> ${chip(x.st)}</span>`).join("");
  let h = `<div class="row"><span class="chip dark">${esc(r.f)}</span>${chip(r.st)}${r.tp.map((t) => `<span class="chip">${esc(topic(t))}</span>`).join("")}<span class="spacer"></span><a class="btn sm ghost" href="${r.u}" target="_blank" rel="noopener">${T("doc.bpk")}</a>${r.pdf ? `<a class="btn sm ghost" href="${r.pdf}" target="_blank" rel="noopener">${T("doc.pdf")}</a>` : ""}</div>
    <h1 style="margin-top:10px;font-size:22px">${esc(r.t)}</h1><p class="mute">${esc(r.f)} No. ${esc(r.n)} Tahun ${r.y}${kb ? " · " + esc(L(kb.zh)) : ""} · ${esc(agency(r.ag))}</p>
    <div class="grid g4" style="margin:10px 0"><div class="stat"><b>${r.de || "–"}</b><span>${T("l.enacted")}</span></div><div class="stat"><b>${r.dp || "–"}</b><span>${T("doc.promulgated")}</span></div><div class="stat"><b>${r.dv || "–"}</b><span>${T("l.effective")}</span></div><div class="stat"><b>${r.rv}</b><span>${T("doc.relevance")}</span></div></div>
    ${(rels || inbound) ? `<h3>${T("doc.relations")}</h3><div class="rel">${rels}${inbound}</div>` : ""}`;
  if (sum) {
    const S = (v) => esc(L(v));
    h += `<div class="sum card" style="background:#fbfaf5"><h3>${T("sum.h")} <span class="chip ${sum._generated === "curated" ? "ok" : "info"}">${sum._generated === "curated" ? T("sum.curated") : T("sum.ai", { m: esc(sum._model || "") })}</span> ${sum.risk_level ? `<span class="chip ${{ high: "bad", medium: "warn", low: "info", info: "" }[sum.risk_level]}">${T("sum.risk", { r: sum.risk_level })}</span>` : ""}</h3>
    ${sum.title ? `<p><b>${S(sum.title)}</b></p>` : ""}<p>${S(sum.summary || sum.summary_zh)}</p>${sum.key_points?.length ? `<h4>${T("sum.points")}</h4><ul>${sum.key_points.map((k) => `<li><b>Pasal ${esc(k.pasal)}</b> ${S(k.point)}</li>`).join("")}</ul>` : ""}
    ${sum.what_changed?.length ? `<h4>${T("sum.changed")}</h4><ul>${sum.what_changed.map((k) => `<li><b>Pasal ${esc(k.pasal)}</b>: ${S(k.before)} → ${S(k.after)}</li>`).join("")}</ul>` : ""}
    ${sum.effective_dates?.length ? `<h4>${T("sum.eff")}</h4><ul>${sum.effective_dates.map((k) => `<li>${esc(k.date)}: ${S(k.what)}</li>`).join("")}</ul>` : ""}
    ${sum.affected?.length ? `<h4>${T("sum.affected")}</h4><ul>${sum.affected.map((k) => `<li>${S(k)}</li>`).join("")}</ul>` : ""}
    ${sum.actions?.length ? `<h4>${T("sum.actions")}</h4><ul>${sum.actions.map((k) => `<li><b>${S(k.who)}</b>: ${S(k.action)} (${esc(k.deadline)})</li>`).join("")}</ul>` : ""}
    ${sum.joiway_note ? `<p class="note">${T("sum.hptl")}${S(sum.joiway_note)}</p>` : ""}</div>`;
  }
  if (diff) {
    const eff = [...new Set(diff.effective.filter((e) => e.date !== "on_promulgation").map((e) => e.date))];
    const cnt = (k) => diff.changes.filter((c) => c.kind === k).length;
    h += `<h2 style="margin-top:22px">${T("d.h")} <span class="chip ${diff.confidence === "high" ? "ok" : "warn"}">${T("d.conf", { c: diff.confidence })}</span></h2>
      <p class="mute">${T("d.target", { b: `<a href="?id=${diff.base}" onclick="openDoc('${diff.base}');return false">${esc(diff.base)}</a>`, p: esc(diff.prior_version) })}${eff.length ? " · " + T("d.eff", { d: eff.join(", ") }) : ""}${diff.missing_prior_amendments?.length ? " · <b>" + T("d.missing", { x: diff.missing_prior_amendments.join(", ") }) + "</b>" : ""}</p>
      <div class="row" style="font-size:12.5px"><span class="chip warn">${T("d.modified")} ${cnt("modified")}</span><span class="chip ok">${T("d.added")} ${cnt("added")}</span><span class="chip bad">${T("d.deleted")} ${cnt("deleted")}</span>${diff.annex ? `<span class="chip info">${T("d.annexChanged", { n: diff.annex.rows.filter((x) => x.old !== x.new).length })}</span>` : ""}</div>`;
    for (const c of diff.changes) {
      const cls = { modified: "warn", added: "ok", deleted: "bad", annex: "info", other: "", unparsed: "bad" }[c.kind] || "";
      h += `<div class="change"><div class="h"><span class="chip ${cls}">${T("d." + (cls === "" && c.kind !== "other" ? "other" : c.kind))}</span><b>Pasal ${esc(c.pasal)}</b><span class="mute">${esc(c.instruction || "")}</span>${c.similarity != null ? `<span class="spacer"></span><span class="mute">${T("d.sim", { s: pct(c.similarity, 0) })}</span>` : ""}</div>${c.diff ? `<div class="body diff">${diffHtml(c.diff)}</div>` : c.raw ? `<div class="body mono" style="white-space:pre-wrap;font-size:12.5px">${esc(c.raw.slice(0, 1500))}</div>` : ""}</div>`;
    }
    if (diff.annex) h += `<h3>${T("d.annexH")} ${diff.annex.confidence !== "high" ? verifyTag() : ""}</h3><div class="tbl-wrap"><table><thead><tr><th>#</th><th>${T("d.ctx")}</th><th>${T("d.unit")}</th><th class="num">${T("d.old")}</th><th class="num">${T("d.new")}</th><th class="num">${T("d.chg")}</th></tr></thead><tbody>${diff.annex.rows.map((x) => `<tr${x.old !== x.new ? ' style="background:#fff8e6"' : ""}><td>${x.idx + 1}</td><td>${esc(x.label)}</td><td>${esc(x.unit)}</td><td class="num">${num(x.old)}</td><td class="num">${num(x.new)}</td><td class="num">${x.change_pct == null ? "–" : (x.change_pct > 0 ? "+" : "") + x.change_pct + "%"}</td></tr>`).join("")}</tbody></table></div><p class="help">${esc(diff.annex.old_table)} → ${esc(diff.annex.new_table)}</p>`;
  }
  if (doc) {
    const cons = r.ca ? await j(D + "docs/" + id + ".consolidated.json").catch(() => null) : null;
    h += `<h2 style="margin-top:22px">${T("a.h")} <span class="mute" style="font-size:13px;font-weight:400">${T("a.meta", { p: doc.pages, n: doc.articles.length })}${doc.needs_ocr ? " · " + T("a.ocr") : ""}${doc.ocr_pages ? " · " + T("a.ocrPages", { n: doc.ocr_pages }) : ""}</span></h2>
      ${cons ? `<div class="tabs"><button class="on" onclick="showArts(this,'orig')">${T("a.orig")}</button><button onclick="showArts(this,'cons')">${T("a.cons", { v: esc(cons.as_of) })}</button></div>` : ""}
      <div id="arts-orig">${doc.articles.map((a) => `<div class="art"><b>Pasal ${esc(a.no)}${a.chapter ? ` <small class="mute">· ${esc(a.chapter)}</small>` : ""}</b>${esc(a.text)}</div>`).join("") || `<p class='mute'>${T("a.none")}</p>`}</div>
      ${cons ? `<div id="arts-cons" hidden>${cons.articles.map((a) => `<div class="art"><b>Pasal ${esc(a.no)}</b>${esc(a.text)}</div>`).join("")}</div>` : ""}
      ${doc.amendment_ops?.length ? `<h3 style="margin-top:16px">${T("a.ops")}</h3><ul>${doc.amendment_ops.map((o) => `<li><span class="chip">${esc(o.op)}</span> Pasal ${esc((o.pasal || []).join(", ") || "-")} — ${esc(o.instruction)}</li>`).join("")}</ul>` : ""}`;
  } else h += `<p class="note" style="margin-top:20px">${T("a.notext")}</p>`;
  $("#doc").innerHTML = h;
  window.scrollTo({ top: 0 });
}
window.openDoc = openDoc;
window.showArts = (btn, which) => { $$(".tabs button", btn.parentElement).forEach((b) => b.classList.toggle("on", b === btn)); $("#arts-orig").hidden = which !== "orig"; $("#arts-cons").hidden = which !== "cons"; };

async function init() {
  try { [META, INDEX] = await Promise.all([j(D + "meta.json"), j(D + "index.json")]); } catch (e) { $("#meta").textContent = T("m.nodata"); return; }
  INDEX.forEach((r) => byId[r.id] = r);
  const sc = META.status_counts;
  $("#meta").innerHTML = T("m.line", { t: META.total, x: META.with_text, d: META.diffs, s: META.summaries, g: META.generated_at.slice(0, 16).replace("T", " ") }) + `<br><span class="mute">${T("m.counts", { a: sc.in_force || 0, b: sc.amended || 0, c: sc.partially_revoked || 0, d: sc.revoked || 0 })}</span>`;
  $("#f-form").innerHTML += META.forms.map((f) => `<option>${f}</option>`).join("");
  $("#f-ag").innerHTML += Object.entries(META.agencies).map(([k, v]) => `<option value="${k}">${esc(L(v))}</option>`).join("");
  $("#f-tp").innerHTML += Object.entries(META.topics).map(([k, v]) => `<option value="${k}">${esc(L(v))}</option>`).join("");
  $("#f-y").innerHTML += [...new Set(INDEX.map((r) => r.y))].sort((a, b) => b - a).map((y) => `<option>${y}</option>`).join("");
  applyFilter();
  const alerts = await j(D + "alerts.json").catch(() => []);
  $("#alerts").innerHTML = alerts.map((a) => `<div class="it"><div><a class="id" href="?id=${a.id}" onclick="openDoc('${a.id}');return false">${esc(a.id)}</a><div class="m">${a.date}</div></div><div><div class="t">${esc(a.title)}</div><div class="m">${T("k." + a.kind)}${a.effective ? " · " + T("l.effective") + " " + a.effective : ""}${a.diff_headline ? " · " + T("al.diff", { m: a.diff_headline.modified, a: a.diff_headline.added, d: a.diff_headline.deleted }) + (a.diff_headline.annex_rows_changed ? " · " + T("al.annex", { n: a.diff_headline.annex_rows_changed }) : "") : ""}${a.summary ? "<br>" + esc(L(a.summary)) : ""}</div></div><div>${chip(a.status)}<div class="m" style="text-align:right">${T("l.rel", { r: a.relevance })}</div></div></div>`).join("") || `<div class='empty'>${T("al.none")}</div>`;
  $("#src").innerHTML = `<h2>${T("s.h")}</h2><div class="tbl-wrap"><table><thead><tr><th>${T("s.src")}</th><th>${T("s.url")}</th><th>${T("s.status")}</th></tr></thead><tbody>${META.sources.map((s) => `<tr><td>${esc(s.name)}</td><td><a href="${s.url}" target="_blank" rel="noopener">${esc(s.url)}</a></td><td><span class="chip ${{ live: "ok", bpk: "info", todo: "" }[s.adapter]}">${T("s." + s.adapter)}</span></td></tr>`).join("")}</tbody></table></div><h3 style="margin-top:16px">${T("s.pipe")}</h3><p class="mute">${T("s.pipeP")}</p><h3>${T("s.types")}</h3><p class="mute">${META.bpk_jenis_crawled.join(" · ")}</p>`;
  const u = new URL(location.href);
  if (u.searchParams.get("id")) openDoc(u.searchParams.get("id")); else if (u.searchParams.get("tab")) tab(u.searchParams.get("tab"));
}
init();
</script>
</body>
</html>
