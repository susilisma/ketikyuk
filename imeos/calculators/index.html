<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-t="p.title">Calculators · Indonesia Market Entry OS</title>
<link rel="stylesheet" href="/imeos/assets/os.css">
<style>
.two{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.bars{display:grid;gap:6px;font-size:12.5px}
.bars .b{display:grid;grid-template-columns:60px 1fr 160px;gap:8px;align-items:center}
.bars .b i{display:block;height:14px;background:var(--brand2);border-radius:3px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:13.5px}
.kv b{font-variant-numeric:tabular-nums}
.pane{display:none}.pane.on{display:block}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero"><div class="eyebrow">Calculators</div><h1 data-t="p.h1"></h1>
    <p class="lede"><span data-t="p.fx"></span> 1 USD = <input type="number" id="fxusd" style="width:90px"> IDR, 1 CNY = <input type="number" id="fxcny" style="width:90px"> IDR <button class="btn sm ghost" id="fxsave" data-t="p.save"></button></p></div>
  <div class="tabs" id="tabs"><button data-p="setup" class="on" data-t="tab.setup"></button><button data-p="pay" data-t="tab.pay"></button><button data-p="excise" data-t="tab.excise"></button><button data-p="landed" data-t="tab.landed"></button></div>

  <section class="pane on" id="p-setup"><div class="two">
    <form class="card" onsubmit="return false">
      <div class="fld"><label class="f" data-t="s.mode"></label><select id="s-mode"><option value="pma">PT PMA</option><option value="rep" data-t="s.rep"></option><option value="distributor" data-t="s.dist"></option></select></div>
      <div class="fld"><label class="f" data-t="s.sector"></label><select id="s-sector"></select></div>
      <div class="fld"><label class="f" data-t="s.inv"></label><input type="number" id="s-inv" value="10"></div>
      <div class="fld"><label class="f" data-t="s.acts"></label><div class="chips-in" id="s-acts"><label><input type="checkbox" value="import" checked><span data-t="s.import"></span></label><label><input type="checkbox" value="manufacture"><span data-t="s.manu"></span></label><label><input type="checkbox" value="ecommerce"><span data-t="s.ecom"></span></label></div></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div class="fld"><label class="f" data-t="s.staff"></label><input type="number" id="s-staff" value="10"></div><div class="fld"><label class="f" data-t="s.expats"></label><input type="number" id="s-exp" value="2"></div></div>
      <div class="fld"><label class="f" data-t="s.env"></label><select id="s-env"><option>SPPL</option><option>UKL-UPL</option><option>AMDAL</option></select></div>
      <div class="fld"><label class="f" data-t="s.certs"></label><div class="chips-in" id="s-certs"></div></div>
      <button class="btn" id="s-go" data-t="calc"></button>
    </form>
    <div class="card" id="s-out"></div></div></section>

  <section class="pane" id="p-pay"><div class="two">
    <form class="card" onsubmit="return false">
      <div class="fld"><label class="f" data-t="w.gross"></label><input type="number" id="w-gross" value="8000000" step="100000"></div>
      <div class="fld"><label class="f" data-t="w.ump"></label><select id="w-ump"></select><div class="help" data-t="w.umpHelp"></div></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
        <div class="fld"><label class="f" data-t="w.marital"></label><select id="w-married"><option value="0" data-t="w.single"></option><option value="1" data-t="w.married"></option></select></div>
        <div class="fld"><label class="f" data-t="w.dep"></label><input type="number" id="w-dep" value="0" min="0" max="3"></div>
        <div class="fld"><label class="f" data-t="w.jkk"></label><select id="w-jkk"></select></div>
        <div class="fld"><label class="f" data-t="w.thr"></label><input type="number" id="w-thr" value="1" step="0.5"></div>
        <div class="fld"><label class="f" data-t="w.npwp"></label><select id="w-npwp"><option value="1" data-t="yes"></option><option value="0" data-t="w.noNpwp"></option></select></div>
        <div class="fld"><label class="f" data-t="w.res"></label><select id="w-res"><option value="1" data-t="w.resident"></option><option value="0" data-t="w.nonres"></option></select></div>
      </div>
      <div class="fld"><label class="f" data-t="w.n"></label><input type="number" id="w-n" value="1" min="1"></div>
      <button class="btn" id="w-go" data-t="calc"></button>
    </form>
    <div class="card" id="w-out"></div></div></section>

  <section class="pane" id="p-excise"><div class="two">
    <form class="card" onsubmit="return false">
      <div class="fld"><label class="f" data-t="e.type"></label><select id="e-type"></select></div>
      <div class="fld"><label class="f" data-t="e.year"></label><select id="e-year"></select></div>
      <div class="fld"><label class="f" data-t="e.vol"></label><input type="number" id="e-vol" value="2" step="0.1"><div class="help" data-t="e.volHelp"></div></div>
      <div class="fld"><label class="f" data-t="e.hje"></label><input type="number" id="e-hje" value="45000" step="500"><div class="help" data-t="e.hjeHelp"></div></div>
      <div class="fld"><label class="f" data-t="e.units"></label><input type="number" id="e-units" value="10000"></div>
      <button class="btn" id="e-go" data-t="calc"></button>
    </form>
    <div><div class="card" id="e-out"></div><div class="card" id="e-hist" style="margin-top:16px"></div></div></div></section>

  <section class="pane" id="p-landed"><div class="two">
    <form class="card" onsubmit="return false">
      <div class="fld"><label class="f" data-t="l.cif"></label><input type="number" id="l-cif" value="1000000000" step="1000000"></div>
      <div class="fld"><label class="f" data-t="l.duty"></label><input type="number" id="l-duty" value="5" step="0.5"> %<div class="help" data-t="l.dutyHelp"></div></div>
      <div class="fld"><label class="f" data-t="l.add"></label><input type="number" id="l-add" value="0" step="0.5"> %</div>
      <div class="fld"><label class="f">PPh 22</label><select id="l-pph"><option value="0.025" data-t="l.pph1"></option><option value="0.075" data-t="l.pph2"></option><option value="0.10" data-t="l.pph3"></option></select></div>
      <div class="fld"><label class="f" data-t="l.lux"></label><input type="number" id="l-lux" value="0" step="5"> %</div>
      <button class="btn" id="l-go" data-t="calc"></button>
    </form>
    <div class="card" id="l-out"></div></div></section>
  <p class="disclaimer" data-t="p.disc"></p>
</main>
<script src="/imeos/assets/i18n.js"></script>

<script src="/imeos/assets/common.js"></script><script src="/imeos/assets/kb.js"></script><script src="/imeos/assets/calc.js"></script>
<script>
applyI18N();
const F = fx(); $("#fxusd").value = F.usd; $("#fxcny").value = F.cny;
$("#fxsave").onclick = () => { store.set("fx", { usd: +$("#fxusd").value, cny: +$("#fxcny").value }); location.reload(); };
$$("#tabs button").forEach((b) => b.onclick = () => { $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); $$(".pane").forEach((p) => p.classList.toggle("on", p.id === "p-" + b.dataset.p)); location.hash = b.dataset.p; });
if (location.hash) { const b = $(`#tabs button[data-p="${location.hash.slice(1)}"]`); b && b.click(); }

$("#s-sector").innerHTML = KB.sectors.map((s) => `<option value="${s.id}">${esc(L(s.zh))}</option>`).join("");
$("#s-certs").innerHTML = Object.entries(KB.certs).filter(([k, c]) => c.cost[1] > 0).map(([k, c]) => `<label><input type="checkbox" value="${k}"><span>${esc(L(c.zh))}</span></label>`).join("");
$("#s-sector").onchange = () => { const s = KB.sectors.find((x) => x.id === $("#s-sector").value); $$("#s-certs input").forEach((i) => i.checked = s.certs.includes(i.value)); }; $("#s-sector").onchange();
$("#s-go").onclick = () => {
  const input = { mode: $("#s-mode").value, sector: $("#s-sector").value, investment: +$("#s-inv").value, activities: $$("#s-acts input:checked").map((i) => i.value), staff: +$("#s-staff").value, expats: +$("#s-exp").value };
  const B = CALC.setupBudget(input, $$("#s-certs input:checked").map((i) => i.value), $("#s-env").value);
  $("#s-out").innerHTML = `<h3>${T("s.est")}</h3><div class="tbl-wrap"><table><thead><tr><th>${T("r.item")}</th><th>${T("r.type")}</th><th class="num">${T("r.lo")}</th><th class="num">${T("r.hi")}</th></tr></thead><tbody>${B.rows.map((r) => `<tr><td>${esc(L(r.zh))}${r.mult > 1 ? " × " + r.mult : ""}</td><td>${T("r." + r.phase)}</td><td class="num">${idr(r.lo)}</td><td class="num">${idr(r.hi)}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="2">${T("s.oneOff")}</td><td class="num">${idr(B.oneOff.lo)}<br><small>¥${num(toCNY(B.oneOff.lo))} / $${num(toUSD(B.oneOff.lo))}</small></td><td class="num">${idr(B.oneOff.hi)}<br><small>¥${num(toCNY(B.oneOff.hi))} / $${num(toUSD(B.oneOff.hi))}</small></td></tr><tr><td colspan="2">${T("s.annual")}</td><td class="num">${idr(B.annual.lo)}<br><small>¥${num(toCNY(B.annual.lo))}</small></td><td class="num">${idr(B.annual.hi)}<br><small>¥${num(toCNY(B.annual.hi))}</small></td></tr></tfoot></table></div>${input.mode === "pma" ? `<p class="note">${T("s.capital", { c: num(toCNY(10e9)) })}</p>` : ""}`;
};
$("#s-go").click();

$("#w-ump").innerHTML = `<option value="">—</option>` + KB.labor.ump2025.map((u) => `<option value="${u[1]}">${esc(u[0])} ${idr(u[1])}</option>`).join("");
$("#w-ump").onchange = () => { if ($("#w-ump").value) $("#w-gross").value = $("#w-ump").value; };
$("#w-jkk").innerHTML = KB.bpjs.tk.jkk.map((j, i) => `<option value="${i}">${esc(L(j[0]))} ${(j[1] * 100).toFixed(2)}%</option>`).join("");
$("#w-go").onclick = () => {
  const n = +$("#w-n").value || 1;
  const r = CALC.payroll({ gross: +$("#w-gross").value, married: $("#w-married").value === "1", dependents: +$("#w-dep").value, jkkClass: +$("#w-jkk").value, thrMonths: +$("#w-thr").value, hasNpwp: $("#w-npwp").value === "1", resident: $("#w-res").value === "1" });
  const row = (k, v, b) => `<span>${T(k)}</span><b>${b ? "<b>" : ""}${idr(v)}${b ? "</b>" : ""}</b>`;
  $("#w-out").innerHTML = `<h3>${T("w.per")}</h3><div class="grid g2"><div><h4 class="mute">${T("w.empCost")}</h4><div class="kv">${row("w.wage", r.gross)}${row("w.jkkL", r.emp.jkk)}${row("w.jkm", r.emp.jkm)}${row("w.jht", r.emp.jht)}${row("w.jp", r.emp.jp)}${row("w.kes", r.emp.kes)}${row("w.thrM", r.thr / 12)}${row("w.empTotal", r.employerCost, 1)}</div></div><div><h4 class="mute">${T("w.deduct")}</h4><div class="kv">${row("w.jht", r.ee.jht).replace("3.7%", "2%").replace("3,7%", "2%")}${row("w.jp", r.ee.jp).replace("2%", "1%")}${row("w.kes", r.ee.kes).replace("4%", "1%")}${row("w.pph", r.monthlyTax)}${row("w.net", r.takeHome, 1)}</div></div></div>
  <h4 class="mute" style="margin-top:14px">${T("w.annual")}</h4><div class="kv">${row("w.annualGross", r.annualGross)}${row("w.jobCost", -r.jobCost)}${row("w.pension", -r.pension)}${row("w.ptkp", -r.ptkp)}${row("w.pkp", r.pkp)}${row("w.tax", r.annualTax, 1)}</div>
  ${n > 1 ? `<div class="note">${T("w.total", { n, v: idr(r.employerCost * 12 * n), c: num(toCNY(r.employerCost * 12 * n)), t: idr(r.annualTax * n) })}</div>` : ""}
  <p class="help">${esc(L(KB.pph21.note))} ${T("w.note2")} ${esc(L(KB.bpjs.tk.jpCapNote))}.</p>`;
};
$("#w-go").click();

$("#e-type").innerHTML = KB.excise.types.map((t) => `<option value="${t[0]}">${esc(L(t[1]))}</option>`).join("");
$("#e-year").innerHTML = Object.keys(KB.excise.years).reverse().map((y) => `<option value="${y}">${y}</option>`).join("");
$("#e-go").onclick = () => {
  const type = $("#e-type").value, year = +$("#e-year").value;
  const r = CALC.excise({ type, year, volume: +$("#e-vol").value, hje: +$("#e-hje").value, units: +$("#e-units").value });
  const t = KB.excise.types.find((x) => x[0] === type); const unit = t[2], hjeUnit = t[3] || t[2];
  $("#e-out").innerHTML = `<h3>${year} · ${esc(L(t[1]))}</h3><div class="kv"><span>${T("e.rate")}</span><b>${idr(r.rate)} / ${unit}</b><span>${T("e.min")}</span><b>${idr(r.minHje)} / ${hjeUnit}</b><span>${T("e.used")}</span><b>${idr(r.hjeUsed)}</b><span>${T("e.cukai")}</span><b>${idr(r.cukai)}</b><span>${T("e.ppn")}</span><b>${idr(r.ppn)}</b><span>${T("e.pr")}</span><b>${idr(r.pajakRokok)}</b><span>${T("e.total")}</span><b><b>${idr(r.totalTax)}</b> (${T("e.share", { p: pct(r.share, 1) })})</b><span>${T("e.batch", { n: num(+$("#e-units").value) })}</span><b><b>${idr(r.batch.total)}</b> (≈ ¥${num(toCNY(r.batch.total))})</b></div>
    <p class="help" style="margin-top:10px">${T("e.src")} ${regLink(r.src)}${r.note ? " · " + esc(L(r.note)) + verifyTag() : ""}. ${esc(L(KB.excise.note))} ${T("e.extra")}</p>`;
  const years = Object.keys(KB.excise.years), max = Math.max(...years.map((y) => KB.excise.years[y][type][0]));
  $("#e-hist").innerHTML = `<h3>${T("e.hist")} · ${esc(L(t[1]))}</h3><div class="bars">${years.map((y) => { const [rate, hje] = KB.excise.years[y][type]; return `<div class="b"><span>${y}</span><i style="width:${(rate / max) * 100}%"></i><span>${idr(rate)}/${unit} · HJE ${idr(hje)}</span></div>`; }).join("")}</div><p class="help">${T("e.histSrc", { s: [...new Set(years.map((y) => KB.excise.years[y].src))].map(regLink).join(" · ") })}</p>`;
};
$("#e-go").click();

$("#l-go").onclick = () => {
  const r = CALC.landed({ cif: +$("#l-cif").value, dutyRate: +$("#l-duty").value / 100, addRate: +$("#l-add").value / 100, pph22: +$("#l-pph").value, luxury: +$("#l-lux").value / 100 });
  $("#l-out").innerHTML = `<h3>${T("l.h")}</h3><div class="kv"><span>${T("l.dutyL")}</span><b>${idr(r.duty)}</b><span>${T("l.addL")}</span><b>${idr(r.add)}</b><span>${T("l.ppn")}</span><b>${idr(r.ppn)}</b><span>${T("l.luxL")}</span><b>${idr(r.ppnbm)}</b><span>PPh 22</span><b>${idr(r.pph)}</b><span>${T("l.cash")}</span><b><b>${idr(r.cashOut)}</b></b><span>${T("l.cred")}</span><b>${idr(r.creditable)}</b><span>${T("l.total")}</span><b><b>${idr(r.total - r.creditable)}</b></b></div><p class="help">${T("l.note", { a: regLink("PMK-2022-26"), b: regLink("PMK-2024-131") })}</p>`;
};
$("#l-go").click();
</script>
</body>
</html>
