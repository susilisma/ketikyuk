<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-t="p.title">Contracts & Templates · Indonesia Market Entry OS</title>
<link rel="stylesheet" href="/imeos/assets/os.css">
<style>
.two{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.pane{display:none}.pane.on{display:block}
.contract{background:#fff;border:1px solid var(--line);padding:32px 40px;font-size:13.5px;line-height:1.7}
.contract h2{text-align:center;font-size:17px;border:0;margin:0 0 4px}
.contract .sub{text-align:center;color:var(--mute);margin-bottom:18px}
.contract .cl{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:10px 0;break-inside:avoid}
.contract .cl.single{grid-template-columns:1fr}
.contract .cl b{display:block;margin-bottom:2px}
.contract .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px;text-align:center}
.contract .sig div{border-top:1px solid #333;padding-top:6px}
.tpl{cursor:pointer}
@media print{.two{grid-template-columns:1fr}.two form,.tabs,.hero{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero"><div class="eyebrow">Contracts & Templates</div><h1 data-t="p.h1"></h1><p class="lede" data-t="p.lede"></p></div>
  <div class="tabs" id="tabs"><button data-p="lc" class="on" data-t="tab.lc"></button><button data-p="tpl" data-t="tab.tpl"></button><button data-p="dd" data-t="tab.dd"></button></div>

  <section class="pane on" id="p-lc"><div class="two">
    <form class="card" onsubmit="return false">
      <div class="fld"><label class="f" data-t="c.type"></label><select id="c-type"><option value="PKWTT" data-t="c.pkwtt"></option><option value="PKWT" data-t="c.pkwt"></option></select></div>
      <div class="fld"><label class="f" data-t="c.co"></label><input type="text" id="c-co" value="PT ___ Indonesia"></div>
      <div class="fld"><label class="f" data-t="c.addr"></label><input type="text" id="c-addr" value="Jakarta"></div>
      <div class="fld"><label class="f" data-t="c.rep"></label><input type="text" id="c-rep"></div>
      <div class="fld"><label class="f" data-t="c.emp"></label><input type="text" id="c-emp"></div>
      <div class="fld"><label class="f" data-t="c.nik"></label><input type="text" id="c-nik"></div>
      <div class="fld"><label class="f" data-t="c.pos"></label><input type="text" id="c-pos" value="Staff Marketing"></div>
      <div class="fld"><label class="f" data-t="c.loc"></label><input type="text" id="c-loc" value="Jakarta"></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div class="fld"><label class="f" data-t="c.start"></label><input type="date" id="c-start"></div><div class="fld" id="c-endw"><label class="f" data-t="c.end"></label><input type="date" id="c-end"></div>
      <div class="fld"><label class="f" data-t="c.wage"></label><input type="number" id="c-wage" value="6000000" step="100000"></div><div class="fld"><label class="f" data-t="c.allow"></label><input type="number" id="c-allow" value="500000" step="50000"></div>
      <div class="fld" id="c-probw"><label class="f" data-t="c.prob"></label><input type="number" id="c-prob" value="3" min="0" max="3"></div><div class="fld"><label class="f" data-t="c.hours"></label><select id="c-hours"><option value="5" data-t="c.h5"></option><option value="6" data-t="c.h6"></option></select></div></div>
      <div class="fld"><label class="f" data-t="c.reason"></label><input type="text" id="c-reason" data-t-ph="c.reasonPh"></div>
      <div class="row"><button class="btn" id="c-go" data-t="c.go"></button><button class="btn ghost" type="button" onclick="window.print()" data-t="print"></button></div>
    </form>
    <div id="c-out"></div></div></section>

  <section class="pane" id="p-tpl"><div class="two"><div class="card"><h3 data-t="t.h"></h3><div id="tpl-list"></div><p class="help" data-t="t.help"></p></div><div id="tpl-out" class="contract" contenteditable="true"></div></div></section>

  <section class="pane" id="p-dd"><div class="card"><div class="row"><h2 style="margin:0" data-t="dd.h"></h2><span class="spacer"></span><button class="btn sm ghost" id="dd-export" data-t="dd.export"></button></div><div id="dd"></div></div></section>
  <p class="disclaimer" data-t="p.disc"></p>
</main>

<script>
applyI18N();
$$("#tabs button").forEach((b) => b.onclick = () => { $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); $$(".pane").forEach((p) => p.classList.toggle("on", p.id === "p-" + b.dataset.p)); });
$("#c-start").value = dateISO(new Date());
$("#c-type").onchange = () => { const pkwt = $("#c-type").value === "PKWT"; $("#c-endw").style.opacity = pkwt ? 1 : .4; $("#c-probw").style.opacity = pkwt ? .4 : 1; }; $("#c-type").onchange();
const ONE = LANG === "id"; // Indonesian readers get a single column
const cl = (label, idText, other) => ONE ? `<div class="cl single"><div><b>${label}</b>${idText}</div></div>` : `<div class="cl"><div><b>${label}</b>${idText}</div><div class="zh"><b>${label}</b>${other}</div></div>`;
const fmtDate = (d, loc = "id-ID") => d ? new Date(d).toLocaleDateString(loc, { day: "numeric", month: "long", year: "numeric" }) : "____";
const NUMW = ["", "satu", "dua", "tiga"];
$("#c-go").onclick = () => {
  const v = (id) => esc($(id).value.trim() || "____");
  const T2 = $("#c-type").value, pkwt = T2 === "PKWT", wage = +$("#c-wage").value, allow = +$("#c-allow").value, prob = +$("#c-prob").value, h = $("#c-hours").value, total = wage + allow;
  const idW = wage.toLocaleString("id-ID"), idA = allow.toLocaleString("id-ID"), idT = total.toLocaleString("id-ID");
  const ds = fmtDate($("#c-start").value), de = fmtDate($("#c-end").value), dsO = fmtDate($("#c-start").value, locale), deO = fmtDate($("#c-end").value, locale);
  const zh = LANG === "zh";
  const C = {
    intro: [`Pada hari ini, tanggal ${ds}, yang bertanda tangan di bawah ini:<br><b>1. ${v("#c-co")}</b>, beralamat di ${v("#c-addr")}, diwakili oleh ${v("#c-rep")} selaku Direktur, selanjutnya disebut <b>PERUSAHAAN</b>;<br><b>2. ${v("#c-emp")}</b>, NIK/alamat ${v("#c-nik")}, selanjutnya disebut <b>PEKERJA</b>.<br>Kedua belah pihak sepakat mengadakan perjanjian kerja dengan ketentuan sebagai berikut:`,
      zh ? `本合同于 ${dsO} 由以下双方签署：<br><b>1. ${v("#c-co")}</b>，地址 ${v("#c-addr")}，由董事 ${v("#c-rep")} 代表，以下称<b>公司</b>；<br><b>2. ${v("#c-emp")}</b>，身份证号/地址 ${v("#c-nik")}，以下称<b>员工</b>。<br>双方同意按以下条款订立劳动合同：` : `On ${dsO}, the undersigned:<br><b>1. ${v("#c-co")}</b>, of ${v("#c-addr")}, represented by ${v("#c-rep")} as Director, hereinafter the <b>COMPANY</b>;<br><b>2. ${v("#c-emp")}</b>, ID/address ${v("#c-nik")}, hereinafter the <b>EMPLOYEE</b>,<br>agree to enter into an employment agreement on the following terms:`],
    a1: [`Perusahaan mempekerjakan Pekerja dalam jabatan <b>${v("#c-pos")}</b> dengan tempat kerja di ${v("#c-loc")}. ${pkwt ? `Pekerjaan bersifat ${v("#c-reason")} sebagaimana dimaksud Pasal 56 UU Ketenagakerjaan jo. PP 35/2021.` : "Pekerja wajib melaksanakan tugas sesuai uraian jabatan dan Peraturan Perusahaan."}`,
      zh ? `公司聘用员工担任<b>${v("#c-pos")}</b>，工作地点 ${v("#c-loc")}。${pkwt ? `工作性质为 ${v("#c-reason")}（劳动法第 56 条及 PP 35/2021 所指的定期工作）。` : "员工应按岗位说明与公司规章履行职责。"}` : `The Company employs the Employee as <b>${v("#c-pos")}</b> at ${v("#c-loc")}. ${pkwt ? `The work is ${v("#c-reason")}, of the temporary nature referred to in Article 56 of the Manpower Law and PP 35/2021.` : "The Employee shall perform the duties in the job description and the Company Regulation."}`],
    a2: [pkwt ? `Perjanjian ini berlaku untuk jangka waktu tertentu sejak ${ds} sampai dengan ${de} dan dapat diperpanjang sesuai PP 35/2021 dengan total jangka waktu tidak melebihi 5 (lima) tahun. Pada saat berakhirnya PKWT, Perusahaan membayar uang kompensasi sesuai Pasal 15–16 PP 35/2021.` : `Perjanjian ini berlaku untuk waktu tidak tertentu sejak ${ds}${prob ? `, dengan masa percobaan ${prob} (${NUMW[prob]}) bulan. Selama masa percobaan, Perusahaan dapat mengakhiri hubungan kerja tanpa kewajiban pesangon; upah selama masa percobaan tidak lebih rendah dari upah minimum.` : "."}`,
      pkwt ? (zh ? `本合同为定期合同，自 ${dsO} 起至 ${deO} 止，可按 PP 35/2021 续签，累计不超过 5 年。合同期满时公司按 PP 35/2021 第 15–16 条支付补偿金。` : `This agreement runs for a fixed term from ${dsO} to ${deO} and may be extended under PP 35/2021 up to a total of 5 (five) years. On expiry the Company pays compensation under Articles 15–16 of PP 35/2021.`) : (zh ? `本合同为无固定期限合同，自 ${dsO} 起生效${prob ? `，试用期 ${prob} 个月。试用期内公司可解除劳动关系且无需支付遣散费；试用期工资不低于最低工资。` : "。"}` : `This agreement is for an indefinite term from ${dsO}${prob ? `, with a probation period of ${prob} month(s). During probation the Company may end the employment without severance; probation pay shall not be below the minimum wage.` : "."}`)],
    a3: [`Waktu kerja ${h === "5" ? "8 (delapan) jam sehari dan 40 (empat puluh) jam seminggu untuk 5 hari kerja" : "7 (tujuh) jam sehari dan 40 (empat puluh) jam seminggu untuk 6 hari kerja"}. Kerja lembur dilaksanakan atas perintah Perusahaan dan persetujuan Pekerja serta dibayar sesuai PP 35/2021.`,
      zh ? `工作时间为${h === "5" ? "每周 5 天、每天 8 小时、每周 40 小时" : "每周 6 天、每天 7 小时、每周 40 小时"}。加班须经公司指令与员工同意，并按 PP 35/2021 支付加班费。` : `Working time is ${h === "5" ? "8 hours a day and 40 hours a week over 5 days" : "7 hours a day and 40 hours a week over 6 days"}. Overtime requires the Company's instruction and the Employee's consent and is paid under PP 35/2021.`],
    a4: [`Perusahaan membayar upah pokok sebesar Rp ${idW} dan tunjangan tetap sebesar Rp ${idA} per bulan (total Rp ${idT}), dibayarkan paling lambat tanggal ___ setiap bulan melalui transfer bank, setelah dipotong PPh 21 dan iuran BPJS bagian Pekerja. Perusahaan membayar THR keagamaan sesuai Permenaker 6/2016.`,
      zh ? `公司每月支付基本工资 Rp ${idW} 及固定津贴 Rp ${idA}（合计 Rp ${idT}），于每月 ___ 日前银行转账支付，扣除 PPh 21 与员工承担的 BPJS 缴费。公司按 Permenaker 6/2016 支付宗教节日津贴 THR。` : `The Company pays a base wage of Rp ${idW} and a fixed allowance of Rp ${idA} per month (total Rp ${idT}) by bank transfer no later than the ___ of each month, net of PPh 21 and the Employee's BPJS contributions. The Company pays the religious holiday allowance (THR) under Permenaker 6/2016.`],
    a5: [`Perusahaan mendaftarkan Pekerja sebagai peserta BPJS Ketenagakerjaan (JKK, JKM, JHT, JP, JKP) dan BPJS Kesehatan sesuai peraturan perundang-undangan.`, zh ? `公司依法为员工登记 BPJS 劳动保障（JKK、JKM、JHT、JP、JKP）与 BPJS 健康保障。` : `The Company enrols the Employee in BPJS Employment (JKK, JKM, JHT, JP, JKP) and BPJS Health as required by law.`],
    a6: [`Pekerja berhak atas cuti tahunan 12 (dua belas) hari kerja setelah bekerja 12 bulan terus-menerus, cuti sakit dengan surat dokter, serta hak-hak lain sesuai Peraturan Perusahaan.`, zh ? `员工连续工作满 12 个月后享有 12 个工作日年假，凭医生证明享有病假，其他权利按公司规章执行。` : `After 12 months of continuous service the Employee is entitled to 12 working days of annual leave, to sick leave on a doctor's certificate, and to other rights under the Company Regulation.`],
    a7: [`Pekerja wajib menjaga kerahasiaan informasi Perusahaan selama dan setelah berakhirnya hubungan kerja, tidak memiliki benturan kepentingan, serta mematuhi Peraturan Perusahaan dan tata tertib.`, zh ? `员工在劳动关系存续期间及终止后应保守公司商业秘密，不得存在利益冲突，并遵守公司规章与纪律。` : `The Employee shall keep Company information confidential during and after employment, avoid conflicts of interest, and comply with the Company Regulation and rules of conduct.`],
    a8: [`Pengakhiran hubungan kerja dilaksanakan sesuai UU Ketenagakerjaan jo. UU Cipta Kerja dan PP 35/2021${pkwt ? ". Pihak yang mengakhiri PKWT sebelum jangka waktu berakhir wajib membayar ganti rugi sebesar upah sampai batas waktu berakhirnya perjanjian" : ", termasuk ketentuan pesangon, uang penghargaan masa kerja dan uang penggantian hak"}.`,
      zh ? `劳动关系的终止按劳动法、创造就业法及 PP 35/2021 执行${pkwt ? "。任一方在合同期满前终止合同，须向对方赔偿至合同期满的工资" : "，包括遣散费、工龄奖金与权利补偿的规定"}。` : `Termination follows the Manpower Law, the Job Creation Law and PP 35/2021${pkwt ? ". A party ending the PKWT early shall pay the other the wages due until the end of the term" : ", including severance, service pay and rights compensation"}.`],
    a9: [`Perselisihan diselesaikan secara musyawarah; apabila tidak tercapai, diselesaikan melalui mekanisme UU 2/2004 tentang Penyelesaian Perselisihan Hubungan Industrial. Perjanjian ini dibuat dalam Bahasa Indonesia${ONE ? "" : zh ? " dan Bahasa Mandarin" : " dan Bahasa Inggris"}; dalam hal terdapat perbedaan penafsiran, versi Bahasa Indonesia yang berlaku.`,
      zh ? `争议先行协商；协商不成按 UU 2/2004《劳动争议解决法》处理。本合同以印尼语和中文书就，如有歧义以印尼语版本为准。` : `Disputes are settled amicably first, failing which under Law 2/2004 on Industrial Relations Dispute Settlement. This agreement is made in Indonesian and English; the Indonesian version prevails in case of conflict.`],
  };
  const title = pkwt ? "PERJANJIAN KERJA WAKTU TERTENTU (PKWT)" : "PERJANJIAN KERJA WAKTU TIDAK TERTENTU (PKWTT)";
  const P = (n) => `Pasal ${n}` + (ONE ? "" : "");
  const Pz = (n) => zh ? `第${n}条` : `Article ${n}`;
  const clause = (n, k) => ONE ? cl(P(n), C[k][0]) : `<div class="cl"><div><b>${P(n)}</b>${C[k][0]}</div><div class="zh"><b>${Pz(n)}</b>${C[k][1]}</div></div>`;
  $("#c-out").innerHTML = `<div class="contract"><h2>${title}</h2><div class="sub">${ONE ? "" : T(pkwt ? "k.pkwtTitle" : "k.pkwttTitle") + " · "}No. ___/HRD/${new Date().getFullYear()}</div>
    ${ONE ? `<div class="cl single"><div>${C.intro[0]}</div></div>` : `<div class="cl"><div>${C.intro[0]}</div><div class="zh">${C.intro[1]}</div></div>`}
    ${["a1", "a2", "a3", "a4", "a5", "a6", "a7", "a8", "a9"].map((k, i) => clause(i + 1, k)).join("")}
    <div class="sig"><div>PERUSAHAAN${ONE ? "" : " / " + T("k.company")}<br><br><br>${v("#c-rep")}<br>Direktur</div><div>PEKERJA${ONE ? "" : " / " + T("k.employee")}<br><br><br>${v("#c-emp")}</div></div>
    <p class="help" style="margin-top:20px">${T("k.stamp")} ${pkwt ? T("k.pkwtFile") : ""}</p></div>`;
};

/* templates: [label, id, zh, en] */
const TPL = {
  dist: { name: ["分销协议 Perjanjian Distribusi", "Distribution Agreement / Perjanjian Distribusi", "Perjanjian Distribusi"], body: [
    ["PARA PIHAK", "[Supplier], selanjutnya disebut Prinsipal; PT [Distributor], NIB [__], selanjutnya disebut Distributor.", "[供应商]，以下称委托方；PT [分销商]，NIB [__]，以下称分销商。", "[Supplier], hereinafter the Principal; PT [Distributor], NIB [__], hereinafter the Distributor."],
    ["Pasal 1 Penunjukan", "Prinsipal menunjuk Distributor sebagai distributor [eksklusif/non-eksklusif] Produk [__] di wilayah Republik Indonesia untuk jangka waktu [__] tahun. Distributor wajib mendaftarkan penunjukan ini pada Kementerian Perdagangan (STP) dalam 30 hari.", "委托方指定分销商为产品 [__] 在印尼境内的[独家/非独家]分销商，期限 [__] 年。分销商应在 30 日内向贸易部办理分销商登记（STP）。", "The Principal appoints the Distributor as [exclusive/non-exclusive] distributor of the Products [__] in Indonesia for [__] years. The Distributor shall register the appointment (STP) with the Ministry of Trade within 30 days."],
    ["Pasal 2 Izin Edar", "Distributor mengurus izin edar BPOM/SNI/Halal atas nama Distributor dengan biaya [Prinsipal/Distributor]. Pada berakhirnya perjanjian, Distributor wajib mengalihkan atau memberikan surat pelepasan atas seluruh izin edar kepada pihak yang ditunjuk Prinsipal dalam 30 hari.", "分销商以自身名义办理 BPOM/SNI/清真等注册，费用由[委托方/分销商]承担。协议终止时，分销商须在 30 日内将全部注册证转让或出具放弃函给委托方指定方。", "The Distributor obtains BPOM/SNI/halal registrations in its own name at the [Principal's/Distributor's] cost. On termination it shall transfer, or issue letters of release for, all registrations to the Principal's nominee within 30 days."],
    ["Pasal 3 Target dan Harga", "Target pembelian minimum [__] per tahun. Harga [FOB/CIF] sesuai Lampiran A, ditinjau setiap [6] bulan. Pembayaran [T/T 30% DP, 70% sebelum pengapalan / L/C]. Transaksi di wilayah Indonesia wajib menggunakan Rupiah sesuai UU 7/2011.", "年度最低采购目标 [__]。价格按附件 A（FOB/CIF），每 [6] 个月复核。付款方式 [T/T 30% 预付、70% 装船前 / 信用证]。在印尼境内的交易须按 UU 7/2011 以卢比结算。", "Minimum purchase target [__] per year. Prices [FOB/CIF] per Annex A, reviewed every [6] months. Payment [T/T 30% deposit, 70% before shipment / L/C]. Transactions within Indonesia must be in rupiah under Law 7/2011."],
    ["Pasal 4 Kekayaan Intelektual", "Merek dagang tetap milik Prinsipal. Distributor tidak boleh mendaftarkan merek, domain atau akun marketplace atas namanya sendiri; Prinsipal mendaftarkan merek di DJKI sebelum pengapalan pertama.", "商标归委托方所有。分销商不得以自身名义注册商标、域名或平台店铺；委托方在首批发货前在 DJKI 完成商标注册。", "Trademarks remain the Principal's. The Distributor shall not register marks, domains or marketplace accounts in its own name; the Principal registers its marks at DJKI before the first shipment."],
    ["Pasal 5 Kepatuhan", "Distributor wajib mematuhi ketentuan label Bahasa Indonesia, iklan, pajak, cukai (jika berlaku) dan larangan penjualan kepada anak. Pelanggaran material merupakan alasan pengakhiran seketika.", "分销商应遵守印尼语标签、广告、税务、消费税（如适用）及禁止向未成年人销售等规定。重大违反构成即时解约事由。", "The Distributor shall comply with Indonesian labelling, advertising, tax, excise (where applicable) and the ban on sales to minors. A material breach is grounds for immediate termination."],
    ["Pasal 6 Pengakhiran", "Pengakhiran dengan pemberitahuan [90] hari. Prinsipal berhak membeli kembali stok layak jual dengan harga beli. Tidak ada kompensasi goodwill kecuali diatur undang-undang.", "任一方提前 [90] 日通知可终止。委托方有权按进货价回购可售库存。除法律强制外不支付商誉补偿。", "Either party may terminate on [90] days' notice. The Principal may buy back saleable stock at cost. No goodwill compensation unless required by law."],
    ["Pasal 7 Hukum dan Sengketa", "Diatur hukum Republik Indonesia. Sengketa diselesaikan melalui arbitrase [BANI / SIAC] dalam Bahasa [Inggris]. Perjanjian dibuat dalam Bahasa Indonesia dan [Mandarin/Inggris]; versi Bahasa Indonesia berlaku untuk penafsiran di Indonesia (UU 24/2009).", "适用印尼法律。争议提交 [BANI / SIAC] 仲裁，语言为[英语]。本协议以印尼语与中文书就，在印尼境内以印尼语版本解释（UU 24/2009）。", "Governed by Indonesian law. Disputes go to [BANI / SIAC] arbitration in [English]. Made in Indonesian and English; the Indonesian version governs interpretation in Indonesia (Law 24/2009)."]] },
  nda: { name: ["保密协议 NDA", "Non-Disclosure Agreement / Perjanjian Kerahasiaan", "Perjanjian Kerahasiaan (NDA)"], body: [
    ["Pasal 1 Informasi Rahasia", "Seluruh informasi teknis, komersial, formula, harga, data pelanggan dan rencana usaha yang diungkapkan secara tertulis, lisan atau elektronik.", "以书面、口头或电子方式披露的全部技术、商业、配方、价格、客户数据与业务计划。", "All technical, commercial, formula, pricing, customer and business-plan information disclosed in writing, orally or electronically."],
    ["Pasal 2 Kewajiban", "Pihak Penerima wajib menjaga kerahasiaan, hanya menggunakan untuk Tujuan [evaluasi kerja sama], membatasi akses pada personel yang perlu tahu, dan tidak melakukan rekayasa balik.", "接收方应保密，仅用于[合作评估]目的，限制于需知人员，且不得进行反向工程。", "The Receiving Party shall keep it confidential, use it only for the Purpose [evaluating cooperation], limit access to need-to-know personnel and not reverse-engineer."],
    ["Pasal 3 Jangka Waktu", "Berlaku [2] tahun sejak tanggal perjanjian; kewajiban kerahasiaan berlanjut [5] tahun setelah berakhir.", "自签署日起 [2] 年有效；保密义务在终止后延续 [5] 年。", "Term [2] years from signing; confidentiality survives [5] years after expiry."],
    ["Pasal 4 Pengembalian", "Atas permintaan, seluruh salinan dikembalikan atau dimusnahkan dengan konfirmasi tertulis dalam 14 hari.", "应要求在 14 日内返还或销毁全部副本并书面确认。", "On request, all copies are returned or destroyed with written confirmation within 14 days."],
    ["Pasal 5 Ganti Rugi dan Hukum", "Pelanggaran menimbulkan ganti rugi dan hak atas putusan sela. Hukum Indonesia; Pengadilan Negeri Jakarta Pusat / arbitrase BANI.", "违约方承担损害赔偿，守约方有权申请临时禁令。适用印尼法律；管辖为雅加达中区地方法院 / BANI 仲裁。", "Breach gives rise to damages and injunctive relief. Indonesian law; Central Jakarta District Court / BANI arbitration."]] },
  supply: { name: ["采购/供货协议", "Supply Agreement / Perjanjian Pasokan", "Perjanjian Jual Beli / Pasokan"], body: [
    ["Pasal 1 Objek", "Penjual menjual Barang [__] sesuai spesifikasi Lampiran A; kuantitas per Purchase Order yang dikonfirmasi.", "卖方按附件 A 规格出售货物 [__]；数量以确认的采购订单为准。", "The Seller sells the Goods [__] per the specifications in Annex A; quantities per confirmed Purchase Order."],
    ["Pasal 2 Harga dan Pembayaran", "Harga [CIF Tanjung Priok, Incoterms 2020] dalam [USD]. Pembayaran [T/T] dalam [30] hari sejak B/L. Pajak dan bea di Indonesia ditanggung Pembeli.", "价格按 [CIF 丹戎不碌港，Incoterms 2020] 以[美元]计。自提单日起 [30] 日内电汇。印尼境内税费由买方承担。", "Prices [CIF Tanjung Priok, Incoterms 2020] in [USD]. Payment by [T/T] within [30] days of B/L. Indonesian taxes and duties are for the Buyer."],
    ["Pasal 3 Dokumen dan Kepatuhan", "Penjual menyediakan invoice, packing list, B/L, Certificate of Origin (Form E/RCEP), sertifikat uji, dan dokumen untuk SNI/BPOM/LS. Pembeli bertanggung jawab atas izin impor (PI), LS dan pelabelan Bahasa Indonesia.", "卖方提供发票、装箱单、提单、原产地证（Form E/RCEP）、检测证书及 SNI/BPOM/LS 所需文件。买方负责进口批准（PI）、装运前检验与印尼语标签。", "The Seller provides invoice, packing list, B/L, certificate of origin (Form E/RCEP), test certificates and documents needed for SNI/BPOM/LS. The Buyer is responsible for import approval (PI), LS and Indonesian labelling."],
    ["Pasal 4 Jaminan Mutu", "Garansi [12] bulan sejak penerimaan; klaim cacat dalam [30] hari dengan bukti; penggantian atau kredit.", "自收货起 [12] 个月质保；[30] 日内凭证据提出瑕疵索赔；换货或抵扣。", "Warranty [12] months from receipt; defect claims within [30] days with evidence; replacement or credit."],
    ["Pasal 5 Keadaan Kahar", "Termasuk perubahan peraturan impor/cukai yang melarang atau menunda pengiriman.", "不可抗力包括禁止或延迟发运的进口/消费税法规变更。", "Includes changes in import/excise regulation that prohibit or delay shipment."],
    ["Pasal 6 Hukum dan Sengketa", "Hukum [Indonesia/Singapura]; arbitrase [SIAC/BANI]; bahasa [Inggris]. Versi Bahasa Indonesia disediakan sesuai UU 24/2009.", "适用[印尼/新加坡]法律；[SIAC/BANI] 仲裁；语言[英语]。依 UU 24/2009 提供印尼语版本。", "[Indonesian/Singapore] law; [SIAC/BANI] arbitration; [English]. An Indonesian version is provided under Law 24/2009."]] },
};
$("#tpl-list").innerHTML = Object.entries(TPL).map(([k, t]) => `<div class="req tpl" onclick="loadTpl('${k}')"><b>${esc(L(t.name))}</b></div>`).join("");
window.loadTpl = (k) => { const t = TPL[k]; const other = LANG === "zh" ? 2 : 3; $("#tpl-out").innerHTML = `<h2>${esc(L(t.name))}</h2><div class="sub">${T("k.draft")}</div>` + t.body.map((b) => ONE ? `<div class="cl single"><div><b>${esc(b[0])}</b>${esc(b[1])}</div></div>` : `<div class="cl"><div><b>${esc(b[0])}</b>${esc(b[1])}</div><div class="zh"><b>${esc(b[0])}</b>${esc(b[other])}</div></div>`).join("") + `<div class="sig"><div>Pihak Pertama${ONE ? "" : " / " + T("k.party1")}</div><div>Pihak Kedua${ONE ? "" : " / " + T("k.party2")}</div></div>`; };
loadTpl("dist");

const done = store.get("dd", {});
$("#dd").innerHTML = KB.dd.map(([g, items]) => `<h3 style="margin-top:16px">${esc(L(g))}</h3>${items.map((t) => { const k = t[0]; return `<label class="cl-item ${done[k] ? "done" : ""}"><input type="checkbox" data-k="${esc(k)}" ${done[k] ? "checked" : ""}><span class="cl-t">${esc(L(t))}</span></label>`; }).join("")}`).join("");
$$("#dd input").forEach((c) => c.onchange = () => { done[c.dataset.k] = c.checked; store.set("dd", done); c.closest(".cl-item").classList.toggle("done", c.checked); });
$("#dd-export").onclick = () => download("indonesia-due-diligence.md", "# " + T("dd.h") + "\n\n" + KB.dd.map(([g, items]) => `## ${L(g)}\n` + items.map((t) => `- [${done[t[0]] ? "x" : " "}] ${L(t)}`).join("\n")).join("\n\n"), "text/markdown");
</script>
</body>
</html>
